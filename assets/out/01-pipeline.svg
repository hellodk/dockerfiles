<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1188 300" width="100%" style="max-width:1188px;height:auto;display:block;margin:16px 0" role="img" aria-label="Remediation pipeline from layered findings to a verified clean image" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Remediation pipeline from layered findings to a verified clean image</title><defs><marker id="pipe-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#2563EB"/></marker><marker id="pipe-ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#16A34A"/></marker></defs><text x="24" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">How The Findings Were Cleared</text><text x="24" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start" letter-spacing="0.6">Four Stages From Application Layers To A Verified Registry Digest</text><rect x="24" y="84" width="1140" height="192" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><rect x="56" y="96" width="228" height="148" rx="10" fill="#FEF2F2" stroke="#E5E7EB" stroke-width="1.5"/><rect x="56" y="96" width="4" height="148" rx="2" fill="#DC2626"/><text x="72" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">Application Layer</text><text x="72" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">13 High / Critical + 1 Medium</text><rect x="72" y="204" width="71" height="24" rx="12" fill="#DC2626" opacity="0.14"/><text x="107.5" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">Stage 1</text><rect x="348" y="96" width="228" height="148" rx="10" fill="#FFFBEB" stroke="#E5E7EB" stroke-width="1.5"/><rect x="348" y="96" width="4" height="148" rx="2" fill="#D97706"/><text x="364" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">Base Image</text><text x="364" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">67 / 56 / 575 OS findings</text><rect x="364" y="204" width="71" height="24" rx="12" fill="#D97706" opacity="0.14"/><text x="399.5" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">Stage 2</text><rect x="640" y="96" width="228" height="148" rx="10" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1.5"/><rect x="640" y="96" width="4" height="148" rx="2" fill="#2563EB"/><text x="656" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">Remediation</text><text x="656" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Pin, patch, rebuild, verify</text><rect x="656" y="204" width="71" height="24" rx="12" fill="#2563EB" opacity="0.14"/><text x="691.5" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">Stage 3</text><rect x="932" y="96" width="228" height="148" rx="10" fill="#F0FDF4" stroke="#E5E7EB" stroke-width="1.5"/><rect x="932" y="96" width="4" height="148" rx="2" fill="#16A34A"/><text x="948" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">Verified Clean</text><text x="948" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">0 OS / 0 application</text><rect x="948" y="204" width="71" height="24" rx="12" fill="#16A34A" opacity="0.14"/><text x="983.5" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#16A34A" text-anchor="middle">Stage 4</text><circle cx="1126" cy="130" r="8" fill="none" stroke="#16A34A" stroke-width="2" opacity="0.85"><animate attributeName="r" values="8;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="1126" cy="130" r="3.5" fill="#16A34A"/><line x1="292" y1="170.0" x2="340" y2="170.0" stroke="#2563EB" stroke-width="2" marker-end="url(#pipe-ah)"/><circle cx="292" cy="170.0" r="4.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M0,0 H48"/></circle><text x="316.0" y="156.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">Fixed</text><line x1="584" y1="170.0" x2="632" y2="170.0" stroke="#2563EB" stroke-width="2" marker-end="url(#pipe-ah)"/><circle cx="584" cy="170.0" r="4.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"><animateMotion dur="2.2s" begin="0.45s" repeatCount="indefinite" path="M0,0 H48"/></circle><text x="608.0" y="156.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">Patched</text><line x1="876" y1="170.0" x2="924" y2="170.0" stroke="#2563EB" stroke-width="2" marker-end="url(#pipe-ah)"/><circle cx="876" cy="170.0" r="4.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"><animateMotion dur="2