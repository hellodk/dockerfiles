<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" style="max-width:980px;height:auto;display:block;margin:16px 0" role="img" aria-label="Application image compared with a runtime-only base image" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Application image compared with a runtime-only base image</title><defs><marker id="ana-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#2563EB"/></marker><marker id="ana-ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#16A34A"/></marker></defs><text x="24" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Application Image Versus Runtime-Only Base</text><text x="24" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start" letter-spacing="0.6">Why The Application Column Reads N/A Rather Than Zero On The Base Tags</text><rect x="24" y="84" width="932" height="332" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="112" width="428" height="264" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="64" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Application Image</text><rect x="64" y="164" width="127" height="24" rx="12" fill="#D97706" opacity="0.14"/><text x="127.5" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">Carries the JAR</text><rect x="64" y="206" width="380" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="80" y="229" font-family="system-ui, -apple-system